[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warp-relay"
version = "0.2.0"
description = "A local workbench for PTX synchronization verification and evidence inspection"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
warp-relay = "warp_relay.__main__:main"

[tool.setuptools.packages.find]
include = ["warp_relay*"]

[tool.setuptools.package-data]
warp_relay = ["web/*", "cases/*.json", "reviews/*.json"]
